# Publie le site sur GitHub Pages à chaque modification de la branche main.
# Les cartes, textes, JSON-LD, sitemap, robots.txt et 404 sont régénérés depuis offres.js :
# le site en ligne est donc toujours à jour, même si index.html dans le dépôt a du retard.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dates git pour sitemap.xml (lastmod) et l'alerte « PDF plus ancien »

      - name: Générer la page depuis offres.js
        run: python3 tools/build_page.py --site _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
